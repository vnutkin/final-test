<!-- catalog/templates/catalog/product_list.html -->
{% extends 'base.html' %}

{% block content %}
<h1>Каталог товаров</h1>
<div class="products">
    {% for product in products %}
    <div class="product">
        <img src="{{ product.image.url }}" alt="{{ product.name }}">
        <h3>{{ product.name }}</h3>
        <p>Цена: {{ product.price }} руб.</p>
        <button>Добавить в корзину</button>
    </div>
    {% endfor %}
</div>
{% endblock %}
